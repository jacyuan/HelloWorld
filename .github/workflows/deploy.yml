name: Build and Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore NuGet packages
        run: dotnet restore HelloWorld.sln

      - name: Build
        run: dotnet build HelloWorld.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish HelloWorld/HelloWorld.csproj --configuration Release --output ./publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: drop

      - name: Deploy
        run: |
          echo "Add your deployment commands here"
          # Example: az webapp deploy --name your-app --resource-group your-rg --slot production

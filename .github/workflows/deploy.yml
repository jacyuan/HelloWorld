name: Build and Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Azure?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore NuGet packages
        run: dotnet restore HelloWorld.sln

      - name: Build
        run: dotnet build HelloWorld.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish HelloWorld/HelloWorld.csproj --configuration Release --output ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.inputs.deploy == 'true'
    
    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: HelloWorld-BelieveIt
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish